<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ff8a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Trips">
<title>Our Trips</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
<div id="lock" class="lock" hidden>
  <form id="lockForm" class="lock-card" autocomplete="off">
    <div class="lock-mark">🌴</div>
    <h1 class="script">Our Trips</h1>
    <p>Enter the passphrase to open.</p>
    <input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" required>
    <button type="submit">Open</button>
    <p id="lockErr" class="lock-err" hidden>That passphrase didn't work.</p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-title script" id="topTitle">Our Trips</div>
    <div class="top-sub" id="topSub"></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="trip" class="on">Our trip</button>
    <button data-tab="resort" id="resortTabBtn" hidden>Resort</button>
  </nav>
  <main>
    <section id="tab-trip"></section>
    <section id="tab-resort" hidden></section>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<script src="app.js?v=5"></script>
</body>
</html>
